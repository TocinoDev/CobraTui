[package]
name = "CobraTUI"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.27"
ratatui = "0.24"
anyhow = "1"
rfd = "0.14"

[profile.release]
# Endurecimiento del binario: chequeos de overflow, LTO total en una
# sola unidad de compilación, sin símbolos y sin unwinding.
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"